[package]
name = "ui"
version = "0.1.0"
edition = "2024"

[dependencies]
# Well... this lib absolutely sucks, and is outdated or has never been tested on both Windows and Linux
# tray = { git = "https://github.com/4rchXceed/tray-rs", rev="f461d3aa1d326e655b1e6a6860931e90749174e6" }
# tray-menu = { git = "https://github.com/4rchXceed/tray-rs", rev="f461d3aa1d326e655b1e6a6860931e90749174e6" }
image = { version = "0.25.10", default-features = false, features = ["png"] }
thiserror = "2.0.21"
rustydialogs = "0.4.2"
tempdir = "0.3.7"
simple_logger = "5.2.0"
log = "0.4.34"
wait = "0.2.6"
rfd = "0.17.2"
chrono = "0.4.45"
indexmap = "2.14.2"
tokio = { version = "1.53.1", features = ["full"] }
iced-xml = { git = "https://github.com/4rchXceed/iced-xml", branch = "code-rewrite" }
#iced-xml = { path = "../../../../../../Corbeille/iced-xml/" }

# FFSearch crates
settings = { path = "../../settings" }
application = { path = "../../application" }
infrastructure = { path = "../../infrastructure" }
domain = { path = "../../domain" }

# Features
mcp = { path = "../../frontends/mcp", optional = true }
daemon = { path = "../../frontends/daemon", optional = true }

[features]
ai=["infrastructure/ai", "settings/ai"]
mcp_server=["mcp", "settings/mcp_server"]
daemon_worker=["daemon", "settings/daemon_worker"]
dev = ["iced-xml/css-watcher"]

[target.'cfg(windows)'.dependencies]
tray-item = { version = "0.10.0" }

[target.'cfg(not(windows))'.dependencies]
tray-item = { version = "0.10.0", features = ["ksni"] }

[dev-dependencies]
iced-xml = { git = "https://github.com/4rchXceed/iced-xml", branch = "code-rewrite", features = ["css-watcher"] }
#iced-xml = { path = "../../../../../../Corbeille/iced-xml/", features = ["css-watcher"] }

[target.'cfg(windows)'.build-dependencies]
windres = "*"
