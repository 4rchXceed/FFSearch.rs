[package]
name = "mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "3.2.0", features = ["server", "transport-streamable-http-server"] }
schemars = { version="1.2.2" }
hyper = { version="1.11.1" }
serde = { version="1.0.229" }
hyper-util = { version = "0.1.20", features = ["server", "service", "http1", "tokio"] }
tokio = { version = "1.53.1", features = ["full"] }
application = { path="../../application" }
log = "0.4.34"
rust_string_utils = "0.1.20"
