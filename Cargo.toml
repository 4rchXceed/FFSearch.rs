[workspace]
resolver = "3"
members = [
    "crates/application",
    "crates/domain", "crates/frontends/daemon",
    "crates/frontends/mcp",
    "crates/infrastructure",
    # "crates/ports/tantivy",
    "crates/utils",
]

# Tests
[package]
edition = "2024"
name = "FFSearch"
version = "0.0.0"

[dependencies]
infrastructure = { path = "crates/infrastructure" }
application = { path = "crates/application" }
domain = { path = "crates/domain" }
tokio = { version = "1.53.1", features = ["full"] }
mcp = { path = "crates/frontends/mcp", optional = true }
daemon = { path = "crates/frontends/daemon", optional = true }

[features]
ai=["infrastructure/ai"]
mcp_server=["mcp"]
daemon_worker=["daemon"]

[dev-dependencies]
tempdir = "0.3.7"
simple_logger = "5.2.0"
