[package]
name = "FFSearch"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
tantivy = "0.26.1"
tempdir = "0.3.7"
uuid = {version="1.25.0", features=["v4"]}
walkdir = "2.5.0"
rig = "0.42.0"
rig-core = "0.42.0"
rig-lancedb = "0.42.0"
lancedb = "0.30"
tokio = { version = "1.53.1", features = ["full"] }
serde_json = "1.0.151"
tokio-stream = "0.1.19"
# https://github.com/lancedb/lancedb/tree/main/rust/lancedb -> Tip
lzma-sys = { version = "*", features = ["static"] }
arrow-array = "58.4.0"
tqdm = "0.8.0"
thiserror = "2.0.20"
rmcp = { version = "3.2.0", features = ["server", "transport-streamable-http-server"] }
hyper = "1.11.1"
serde = "1.0.229"
hyper-util = { version = "0.1.20", features = ["server", "service"] }
xberg = { version="1.0.14", features=["pdf", "excel", "office", "hwp", "hwpx", "iwork", "email", "html", "xml", "archives", "mdx", "svg"] }
wait = "0.2.6"
bzip2 = { version = "*", features = ["static"] }

# [patch.crates-io]
# bzip2 = { git = "https://github.com/trifectatechfoundation/bzip2-rs.git", tag = "v0.5.2", default-features = false, features = ["libbz2-rs-sys"] }
