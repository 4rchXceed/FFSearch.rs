[workspace]
resolver = "3"
members = [
    "crates/application",
    "crates/domain",
    "crates/infrastructure",
    # "crates/ports/tantivy",
    "crates/utils",
]

# Tests
[package]
edition = "2024"
name = "FFSearch"
version = "0.0.0"

[dependencies]
