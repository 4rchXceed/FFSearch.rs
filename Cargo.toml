[workspace]
resolver = "3"
members = [
    "crates/application",
    "crates/domain",
    "crates/frontends/daemon",
    "crates/frontends/mcp",
    "crates/frontends/ui",
    "crates/infrastructure",
    "crates/settings",
    "crates/utils",
]

# Tests
[package]
edition = "2024"
name = "FFSearch"
version = "0.0.0"

[dependencies]
infrastructure = { path = "crates/infrastructure" }
application = { path = "crates/application" }
domain = { path = "crates/domain" }
tokio = { version = "1.53.1", features = ["full"] }
mcp = { path = "crates/frontends/mcp", optional = true }
daemon = { path = "crates/frontends/daemon", optional = true }
settings = { path = "crates/settings" }

[features]
ai=["infrastructure/ai", "settings/ai"]
mcp_server=["mcp", "settings/mcp_server"]
daemon_worker=["daemon", "settings/daemon_worker"]

[dev-dependencies]
tempdir = "0.3.7"
simple_logger = "5.2.0"
