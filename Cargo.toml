[package]
name = "FFSearch"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
tantivy = "0.26.1"
uuid = {version="1.25.0", features=["v4"]}
walkdir = "2.5.0"
tqdm = "0.8.0"
thiserror = "2.0.20"
xberg = { version="1.1.5", features=["excel", "office", "hwp", "hwpx", "iwork", "email", "html", "xml", "archives", "mdx", "svg"] }
wait = "0.2.6"
# Default xberg pdf extractor compilation too slow :(
pdf-extract = "0.12.0"
# Feature-specific dep
# AI Deps
rig = { version="0.42.0", optional=true }
rig-core = { version="0.42.0", optional=true }
rig-lancedb = { version="0.42.0", optional=true }
lancedb = { version="0.30", optional=true }
tokio = { version = "1.53.1", features = ["full"] }
serde_json = { version="1.0.151", optional=true }
tokio-stream = { version="0.1.19", optional=true }
# https://github.com/lancedb/lancedb/tree/main/rust/lancedb -> Tip
lzma-sys = { version = "*", features = ["static"], optional=true }
arrow-array = { version="58.4.0", optional=true }
# MCP Deps
rmcp = { version = "3.2.0", features = ["server", "transport-streamable-http-server"], optional=true }
schemars = { version="1.2.2", optional=true }
hyper = { version="1.11.1", optional=true }
serde = { version="1.0.229", optional=true }
hyper-util = { version = "0.1.20", features = ["server", "service"], optional=true }
# Daemon
notify = { version="8.2.0", optional=true }

[dev-dependencies]
tempdir = "0.3.7"

[features]
ai = ["rig", "rig-core", "rig-lancedb", "lancedb", "serde_json", "tokio-stream", "lzma-sys", "arrow-array"]
mcp = ["rmcp", "hyper", "serde", "hyper-util", "schemars"]
daemon = ["notify"]
